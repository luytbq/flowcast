name: check
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v5
        with:
          # Bộ đối chiếu so từng bit với bản tham chiếu, mà sum() của Python đổi
          # cách cộng số thực từ 3.12; giữ đúng phiên bản đã sinh ra golden.
          python-version: '3.14'
      - run: sh tools/check.sh
