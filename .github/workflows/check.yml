name: check
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v5
        with:
          # The conformance suite compares bit for bit with the reference implementation,
          # and Python's sum() changed how it adds floats in 3.12; keep the exact version
          # that generated the goldens.
          python-version: '3.14'
      - run: sh tools/check.sh
